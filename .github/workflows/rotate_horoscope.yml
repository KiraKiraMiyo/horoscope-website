name: Rotate Horoscope

on:
  workflow_dispatch:

  schedule:
    # 00:07 Cambodia time
    # Asia/Phnom_Penh = UTC+7
    # 00:07 Cambodia = 17:07 UTC previous day
    - cron: "7 17 * * *"

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rotate horoscope files
        run: |
          python scripts/rotate_horoscope.py

      - name: Validate rotated files
        run: |
          python -m json.tool today.json > /dev/null

          if [ -f yesterday.json ]; then
            python -m json.tool yesterday.json > /dev/null
          fi

      - name: Commit rotated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add today.json yesterday.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: rotate horoscope day"
          git push