name: Generate Daily Horoscope

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC.
    # 00:00 Asia/Phnom_Penh = 17:00 UTC on the previous day.
    - cron: "0 17 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily horoscope
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_horoscope.py

      - name: Validate today.json
        run: |
          python -m json.tool today.json > /dev/null

      - name: Commit today.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add today.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily horoscope"
          git push